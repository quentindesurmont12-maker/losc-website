      <a href="https://sites.google.com/bisvietnam.com/losc/club-history" target="_top">Club History</a>

<!-- 2. CSS: DESIGN AND ANIMATIONS -->

<style>

/* GOOGLE FONTS */
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap');


/* MAIN CONTAINER */
#losc {
  width: 100%;
  position: relative;
  font-family: 'Inter', sans-serif;
}


/* NAVIGATION BAR */

#navbar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 145px;

  display: grid;
  grid-template-columns: 1fr 130px 1fr;
  align-items: center;

  padding: 0 30px;
  box-sizing: border-box;

  background: transparent;
  z-index: 10;

  transition: 0.5s;
}


/* NAVIGATION LINKS */

.left-links, .right-links {
  display: flex;
  align-items: center;
  justify-content: space-evenly;
  gap: 18px;
  min-width: 0;
}

#navbar a {
  color: white;
  text-decoration: none;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 19px;
  letter-spacing: 1px;
  white-space: nowrap;
  transition: 0.3s;
}

/* HOVER EFFECT */
#navbar a:hover {
  color: #D71920;
}


/* CENTRE SPACE */

.nav-centre {
  width: 100%;
}


/* LOGO AND PAGE TITLE */

#logo {
  position: fixed;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);

  width: 85px;
  z-index: 20;

  text-align: center;
  transition: 0.5s;
}

#logo img {
  width: 100%;
  display: block;
}

#page-title {
  font-family: 'Bebas Neue', sans-serif;
  color: white;
  font-size: 17px;
  letter-spacing: 1.5px;
  margin-top: 2px;
  white-space: nowrap;
}


/* BACKGROUND GIF */

#hero {
  width: 100%;
  height: 650px;
  overflow: hidden;
}

#hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}


/* 3. SCROLLED APPEARANCE */

/* NAVIGATION BECOMES WHITE */

#navbar.scrolled {
  background: white;
  height: 85px;
  box-shadow: 0 2px 8px #00000020;
}

/* LINKS BECOME NAVY BLUE */

#navbar.scrolled a {
  color: #25205F;
}

/* LOGO MOVES INTO NAVIGATION BAR */

#logo.scrolled {
  top: 5px;
  width: 55px;
}

#logo.scrolled #page-title {
  color: #25205F;
  font-size: 11px;
  margin-top: 0;
}


/* 4. MOBILE ADJUSTMENTS */

@media (max-width: 750px) {

  #navbar {
    grid-template-columns: 1fr 75px 1fr;
    padding: 0 8px;
  }

  .left-links, .right-links {
    gap: 5px;
  }

  #navbar a {
    font-size: 12px;
    letter-spacing: 0;
  }

  #logo {
    width: 55px;
    top: 12px;
  }

  #page-title {
    font-size: 12px;
  }

  #logo.scrolled {
    width: 40px;
    top: 5px;
  }

  #logo.scrolled #page-title {
    font-size: 9px;
  }

}

</style>


<!-- 5. JAVASCRIPT: DETECTING SCROLLING -->

<script>

// Find the navigation bar and logo
const navbar = document.getElementById("navbar");
const logo = document.getElementById("logo");

// Detect when the user scrolls
window.addEventListener("scroll", function() {

  // If the user scrolls more than 50 pixels
  if (window.scrollY > 50) {

    navbar.classList.add("scrolled");
    logo.classList.add("scrolled");

  } else {

    navbar.classList.remove("scrolled");
    logo.classList.remove("scrolled");

  }

});

</script>
